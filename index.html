<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. D's Classroom OS</title>

  <!-- Tailwind vendored locally: the classroom smartboard must render even if
       the school network blocks CDNs. Update by re-downloading vendor/tailwind.js. -->
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            page: '#0b0f19',
            card: '#111827',
            card2: '#1f2937',
            line: '#374151',
            camelot: '#ef4444',
            atlantis: '#3b82f6',
            valhalla: '#f59e0b',
            rivendell: '#22c55e',
          },
          fontFamily: {
            display: ['Cinzel', 'Georgia', 'serif'],
            body: ['"Times New Roman"', 'Times', 'Georgia', 'serif'],
          },
        },
      },
    };
  </script>
  <!-- Display font vendored locally (see vendor/fonts.css) — no CDN needed. -->
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-page text-gray-50 font-body h-screen w-screen overflow-hidden flex flex-col">

  <!-- OS Shell: persistent top bar (rendered by js/core/shell.js) -->
  <header id="topbar" class="shrink-0 z-40"></header>

  <!-- Active module mounts here -->
  <main id="module-root" class="flex-1 overflow-y-auto"></main>

  <!-- Full-screen overlays: POTW cinematic, Battle Day, modals -->
  <div id="overlay-root"></div>

  <!-- Floating quick-point adder FAB -->
  <div id="fab-root"></div>

  <!-- 3D libraries for physics dice (pure-JS physics — no WASM, no build step) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "cannon-es": "./vendor/cannon-es.js"
    }
  }
  </script>

  <!-- Google Maps 3D (key injected from js/config.js via loader in main.js) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
